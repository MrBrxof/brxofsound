<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Исполнитель Brxof</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Manrope) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #000000;
            background-image: radial-gradient(circle at 50% 50%, #0d0d11 0%, #000000 100%);
            min-height: 100vh;
            /* Предотвращение лишнего скролла */
            overflow-x: hidden;
            width: 100%;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.01); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 min-h-screen text-gray-100">

    <!-- Контейнер для выравнивания контента -->
    <div class="w-full max-w-md pt-20 pb-8 relative overflow-visible">
        
        <!-- Основной контейнер визитки -->
        <div class="bg-zinc-950/70 backdrop-blur-3xl border border-zinc-900/80 rounded-[2.5rem] p-6 sm:p-8 shadow-[0_30px_60px_-15px_rgba(0,0,0,0.95)] transition-all duration-500 hover:border-zinc-800/80 relative">
            
            <!-- Аватарка со свечением -->
            <div class="absolute -top-16 left-1/2 -translate-x-1/2 z-20">
                <div class="relative w-32 h-32 sm:w-40 sm:h-40">
                    <!-- Свечение -->
                    <img src="ico/11.jpg" alt="" id="avatar-glow" class="absolute inset-0 w-full h-full object-cover rounded-[2rem] blur-2xl opacity-0 scale-105 transition-all duration-700 pointer-events-none" onerror="this.style.display='none'"/>
                    
                    <!-- Фото -->
                    <div class="relative w-full h-full rounded-[2rem] overflow-hidden shadow-[0_20px_40px_-10px_rgba(0,0,0,0.95)] border-2 border-zinc-800 bg-zinc-950">
                        <div id="image-loader" class="absolute inset-0 bg-zinc-950 flex items-center justify-center">
                            <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-zinc-650"></div>
                        </div>
                        <img src="ico/11.jpg" alt="Brxof" id="avatar-img" class="w-full h-full object-cover transition-transform duration-700 opacity-0" onload="handleImageLoaded()" onerror="handleImageError()"/>
                    </div>
                </div>
            </div>

            <!-- Отступ под аватарку -->
            <div class="h-16"></div>
            
            <!-- Заголовок -->
            <div class="flex flex-col items-center mb-8 text-center">
                <h1 class="text-3xl font-black tracking-widest text-white uppercase">Brxof</h1>
                <div class="h-[1px] w-12 bg-zinc-800 my-4"></div>
                <p class="text-[10px] text-zinc-500 uppercase tracking-[0.25em] font-bold">Слушать на всех платформах</p>
            </div>

            <!-- Кнопки -->
            <div class="space-y-3">
                <a href="https://music.yandex.ru/artist/26066567?utm_source=web&utm_medium=copy_link" target="_blank" class="flex items-center justify-between p-4 rounded-2xl bg-zinc-900/20 hover:bg-zinc-900/70 border border-zinc-900/60 hover:border-yellow-500/20 transition-all duration-300">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-[#121214] flex items-center justify-center overflow-hidden border border-zinc-850"><img src="https://yastatic.net/s3/doc-binary/src/support/music/eng/files/icon-on-black-yellow.png" alt="Яндекс" class="w-full h-full object-cover"></div>
                        <span class="font-bold text-[15px]">Яндекс Музыка</span>
                    </div>
                    <svg class="w-4 h-4 text-zinc-650" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </a>

                <div class="flex items-center justify-between p-4 rounded-2xl bg-zinc-900/10 border border-zinc-900/40 opacity-50"><div class="flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-[#121214]/60 flex items-center justify-center border border-zinc-900"></div><span class="font-bold text-[15px] text-zinc-500">Spotify</span></div><span class="text-[9px] bg-zinc-950/80 text-zinc-500 border border-zinc-900/80 px-2 py-1 rounded-lg uppercase tracking-widest">Скоро</span></div>
                <div class="flex items-center justify-between p-4 rounded-2xl bg-zinc-900/10 border border-zinc-900/40 opacity-50"><div class="flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-[#121214]/60 flex items-center justify-center border border-zinc-900"></div><span class="font-bold text-[15px] text-zinc-500">YouTube Music</span></div><span class="text-[9px] bg-zinc-950/80 text-zinc-500 border border-zinc-900/80 px-2 py-1 rounded-lg uppercase tracking-widest">Скоро</span></div>
                
                <a href="https://vk.com/artist/brxof" target="_blank" class="flex items-center justify-between p-4 rounded-2xl bg-zinc-900/20 hover:bg-zinc-900/70 border border-zinc-900/60 hover:border-blue-500/20 transition-all duration-300">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-[#121214] flex items-center justify-center overflow-hidden border border-zinc-850"><img src="https://freesoft.ru/storage/images/770/7698/769716/769716_normal.png" alt="VK" class="w-full h-full object-cover"></div>
                        <span class="font-bold text-[15px]">VK Музыка</span>
                    </div>
                    <svg class="w-4 h-4 text-zinc-650" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </a>
                
                <div class="flex items-center justify-between p-4 rounded-2xl bg-zinc-900/10 border border-zinc-900/40 opacity-50"><div class="flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-[#121214]/60 flex items-center justify-center border border-zinc-900"></div><span class="font-bold text-[15px] text-zinc-500">Звук</span></div><span class="text-[9px] bg-zinc-950/80 text-zinc-500 border border-zinc-900/80 px-2 py-1 rounded-lg uppercase tracking-widest">Скоро</span></div>
            </div>

            <!-- Разделитель -->
            <div class="h-[1px] w-full bg-zinc-900/80 my-6"></div>

            <!-- Донат -->
            <a href="https://www.donationalerts.com/r/brxof" target="_blank" class="w-full flex items-center justify-center gap-3 p-4 rounded-2xl bg-gradient-to-r from-amber-500/10 to-orange-500/10 hover:from-amber-500/20 hover:to-orange-500/20 border border-amber-500/20 mb-3 transition-all duration-300">
                <span class="font-bold text-[15px] text-orange-400">Поддержать исполнителя</span>
            </a>

            <!-- Соцсети -->
            <div class="grid grid-cols-2 gap-3">
                <a href="https://t.me/brxof" target="_blank" class="flex items-center justify-center gap-2 p-3 rounded-2xl bg-[#24A1DE]/10 hover:bg-[#24A1DE]/20 border border-[#24A1DE]/20 transition-all text-[#24A1DE] font-bold text-sm">Telegram</a>
                <a href="https://www.tiktok.com/@brxof" target="_blank" class="flex items-center justify-center gap-2 p-3 rounded-2xl bg-pink-500/10 hover:bg-pink-500/20 border border-pink-500/20 transition-all text-pink-500 font-bold text-sm">TikTok</a>
            </div>
        </div>
    </div>

    <script>
        function handleImageLoaded() {
            const img = document.getElementById('avatar-img');
            const glow = document.getElementById('avatar-glow');
            const loader = document.getElementById('image-loader');
            if (img) img.classList.add('opacity-100');
            if (glow) glow.classList.add('opacity-70');
            if (loader) loader.style.display = 'none';
        }
        function handleImageError() {
            const loader = document.getElementById('image-loader');
            if (loader) loader.innerHTML = `<div class="text-zinc-600 text-xs">Brxof</div>`;
        }
        document.addEventListener('DOMContentLoaded', () => {
            const img = document.getElementById('avatar-img');
            if (img && img.complete) handleImageLoaded();
        });
    </script>
</body>
</html>
