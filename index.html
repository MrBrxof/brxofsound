    <script>
        function handleImageLoaded() {
            const img = document.getElementById('avatar-img');
            const glow = document.getElementById('avatar-glow');
            const loader = document.getElementById('image-loader');
            
            if (img) {
                img.classList.remove('opacity-0');
                img.classList.add('opacity-100');
            }
            if (glow) {
                glow.classList.remove('opacity-0');
                glow.classList.add('opacity-70'); 
            }
            if (loader) {
                loader.style.display = 'none';
            }
        }

        function handleImageError() {
            const loader = document.getElementById('image-loader');
            const glow = document.getElementById('avatar-glow');
            
            if (glow) {
                glow.style.display = 'none';
            }
            if (loader) {
                loader.innerHTML = `
                    <div class="flex flex-col items-center justify-center w-full h-full p-4 text-center bg-gradient-to-br from-zinc-900 to-black">
                        <svg class="w-12 h-12 text-zinc-600 mb-2 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"></path>
                        </svg>
                        <span class="text-sm uppercase font-black text-zinc-450 tracking-widest">Brxof</span>
                        <span class="text-[10px] text-zinc-600 mt-1">ico/11.jpg?</span>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const img = document.getElementById('avatar-img');
            if (img && img.complete) {
                handleImageLoaded();
            }
        });
    </script>
